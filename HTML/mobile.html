<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mobile Decision - Smart Decision Assistant</title>

    <link rel="stylesheet" href="../CSS/style.css">

</head>


<body>


    <!-- ============================= -->
    <!-- HEADER -->
    <!-- ============================= -->

    <header>

        <div class="logo">

            <h1>
                Smart Decision Assistant
            </h1>

            <p>
                Find the right mobile for your needs
            </p>

        </div>


        <div class="assistant">

            <button
                type="button"
                id="assistantButton"
            >
                Smart Assistant
            </button>

        </div>

    </header>



    <!-- ============================= -->
    <!-- MAIN CONTENT -->
    <!-- ============================= -->

    <main>

        <section class="laptop-section">


            <h2>
                Find Your Perfect Mobile
            </h2>


            <p>
                Enter your requirements and get a suitable
                mobile recommendation.
            </p>



            <!-- ============================= -->
            <!-- MOBILE FORM -->
            <!-- ============================= -->

            <div class="laptop-form">


                <!-- Budget -->

                <label for="budget">
                    Your Budget
                </label>


                <input
                    type="number"
                    id="budget"
                    placeholder="Enter your budget"
                    min="1"
                >



                <!-- Camera -->

                <label for="camera">
                    Camera Requirement
                </label>


                <select id="camera">

                    <option value="">
                        Select Camera
                    </option>

                    <option value="6">
                        Basic
                    </option>

                    <option value="7">
                        Good
                    </option>

                    <option value="8">
                        High
                    </option>

                    <option value="9">
                        Very High
                    </option>

                </select>



                <!-- Battery -->

                <label for="battery">
                    Battery Requirement
                </label>


                <select id="battery">

                    <option value="">
                        Select Battery
                    </option>

                    <option value="6">
                        Basic
                    </option>

                    <option value="7">
                        Good
                    </option>

                    <option value="8">
                        High
                    </option>

                    <option value="9">
                        Very High
                    </option>

                </select>



                <!-- Performance -->

                <label for="performance">
                    Performance Level
                </label>


                <select id="performance">

                    <option value="">
                        Select Performance
                    </option>

                    <option value="6">
                        Basic
                    </option>

                    <option value="7">
                        Good
                    </option>

                    <option value="8">
                        High
                    </option>

                    <option value="9">
                        Very High
                    </option>

                </select>



                <!-- Recommendation Button -->

                <button
                    type="button"
                    class="recommend-btn"
                >
                    Get Recommendation
                </button>


            </div>



            <!-- ============================= -->
            <!-- RECOMMENDATION RESULT -->
            <!-- ============================= -->

            <div class="result">


                <h2>
                    Recommendation
                </h2>


                <div class="result-details">

                    <p>
                        Enter your requirements above
                        and click
                        <strong>
                            Get Recommendation
                        </strong>
                        to see the result.
                    </p>

                </div>


            </div>



            <!-- ============================= -->
            <!-- BACK TO HOME -->
            <!-- ============================= -->

            <div class="back-home">

                <a href="../index.html">

                    <button type="button">
                        Back to Home
                    </button>

                </a>

            </div>


        </section>

    </main>



    <!-- ============================= -->
    <!-- FOOTER -->
    <!-- ============================= -->

    <footer>

        <p>
            &copy; 2026 Smart Decision Assistant
        </p>

    </footer>



    <!-- ============================= -->
    <!-- JAVASCRIPT -->
    <!-- ============================= -->

    <script src="../JS/script.js"></script>


</body>

</html>
